name: axorcist-check
on:
  pull_request:
    paths:
      - 'axorcist/**'
      - '.claude-plugin/marketplace.json'
      - 'scripts/install.sh'
      - '.github/workflows/axorcist-check.yml'
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s axorcist/tests -v
      - run: python3 axorcist/tests/check_package.py
