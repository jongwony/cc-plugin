name: coordinator-rules

# Runs the coordinator-rules plugin's tests.
on:
  pull_request:
    paths:
      - "coordinator-rules/**"
      - ".github/workflows/coordinator-rules.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plugin tests
        run: node --test coordinator-rules/scripts/coordinator-rules.test.mjs
